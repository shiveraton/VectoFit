# Install inside nginx http{} (e.g. /etc/nginx/conf.d/vectofit.conf).
# Replace annotator.example.org and certificate paths before nginx -t.
limit_req_zone $binary_remote_addr zone=annotator_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=annotator_register:10m rate=2r/m;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name annotator.example.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://annotator.example.org$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name annotator.example.org;
    ssl_certificate /etc/letsencrypt/live/annotator.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/annotator.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/vectofit/app/vectofit_admin/dist-public;
    client_max_body_size 32k;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api/annotator/login/ {
        limit_req zone=annotator_login burst=3 nodelay;
        include /etc/nginx/snippets/vectofit-proxy.conf;
    }
    location = /api/annotator/register/ {
        limit_req zone=annotator_register burst=2 nodelay;
        include /etc/nginx/snippets/vectofit-proxy.conf;
    }
    location ^~ /api/annotator/ { include /etc/nginx/snippets/vectofit-proxy.conf; }
    location ^~ /_protected_media/ {
        internal;
        alias /srv/vectofit/data/media/;
        sendfile on;
        max_ranges 1;
        add_header Cache-Control "private, no-store" always;
    }
    location ^~ /assets/ { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }
    location = / { return 302 /annotator; }
    location ~ ^/annotator(?:/(?:login|register|[0-9]+))?/?$ {
        add_header Cache-Control no-store;
        try_files /index.html =404;
    }
    location / { return 404; }
}

# The full owner portal is reachable only through an SSH local forward.
server {
    listen 127.0.0.1:8080;
    server_name localhost 127.0.0.1;
    root /srv/vectofit/app/vectofit_admin/dist-private;
    client_max_body_size 4g;
    location /api/ { include /etc/nginx/snippets/vectofit-proxy.conf; }
    location /admin/ { include /etc/nginx/snippets/vectofit-proxy.conf; }
    location /static/ { alias /srv/vectofit/data/static/; }
    location /media/ { alias /srv/vectofit/data/media/; }
    location /_protected_media/ { internal; alias /srv/vectofit/data/media/; }
    location / { try_files $uri $uri/ /index.html; }
}
